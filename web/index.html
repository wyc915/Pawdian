<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Pawdian - pet care reminders and health records">
  <meta name="theme-color" content="#FBF6EF">

  <!-- iOS: installable from Safari > Share > Add to Home Screen. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pawdian">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Pawdian</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { background: #FBF6EF; margin: 0; }
    @media (prefers-color-scheme: dark) { html, body { background: #1A1512; } }
  </style>
</head>
<body>
  <script>
    // Service worker for Web Push (reminders from the home server).
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('push_sw.js', { scope: './' });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
